<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Expense Tracker | Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/mobile.css">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><i data-lucide="wallet-cards"></i></div>
          <div>
            <h1 id="authTitle">Expense Tracker</h1>
            <p>Private spending insights in a polished mobile workspace.</p>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Authentication mode">
          <button class="tab-btn active" type="button" data-auth-tab="login">Login</button>
          <button class="tab-btn" type="button" data-auth-tab="register">Register</button>
        </div>

        <form class="form" id="authForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
          </div>
          <button class="btn primary" type="submit" id="authSubmit">
            <i data-lucide="log-in"></i>
            <span>Login</span>
          </button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./config.js"></script>
    <script type="module" src="./js/auth.js"></script>
  </body>
</html>
