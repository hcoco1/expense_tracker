<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0%" cy="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glow blob -->
  <ellipse cx="0" cy="0" rx="600" ry="400" fill="url(#glow)"/>

  <!-- Logo badge -->
  <rect x="80" y="200" width="90" height="90" rx="24" fill="url(#accent)"/>
  <text x="125" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="56" font-weight="900" fill="white">$</text>

  <!-- App title -->
  <text x="196" y="252" font-family="system-ui,sans-serif" font-size="56" font-weight="900" fill="white" letter-spacing="-1">Expense Tracker</text>

  <!-- Tagline -->
  <text x="196" y="300" font-family="system-ui,sans-serif" font-size="24" fill="rgba(148,163,184,0.9)">Private spending insights — beautifully organized.</text>

  <!-- Feature pills -->
  <rect x="80" y="360" width="180" height="40" rx="20" fill="rgba(59,130,246,0.18)"/>
  <text x="170" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#93c5fd">29 Themes</text>

  <rect x="276" y="360" width="200" height="40" rx="20" fill="rgba(20,184,166,0.18)"/>
  <text x="376" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#5eead4">Multi-currency</text>

  <rect x="492" y="360" width="200" height="40" rx="20" fill="rgba(168,85,247,0.18)"/>
  <text x="592" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#d8b4fe">Real-time Sync</text>

  <rect x="708" y="360" width="200" height="40" rx="20" fill="rgba(234,179,8,0.18)"/>
  <text x="808" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#fde047">3 Languages</text>

  <!-- Mock chart bars -->
  <rect x="900" y="160" width="40" height="200" rx="8" fill="rgba(59,130,246,0.35)"/>
  <rect x="960" y="220" width="40" height="140" rx="8" fill="rgba(59,130,246,0.5)"/>
  <rect x="1020" y="180" width="40" height="180" rx="8" fill="rgba(59,130,246,0.65)"/>
  <rect x="1080" y="140" width="40" height="220" rx="8" fill="url(#accent)"/>

  <!-- Bottom divider -->
  <rect x="80" y="460" width="1040" height="1" fill="rgba(148,163,184,0.12)"/>
  <text x="80" y="498" font-family="system-ui,sans-serif" font-size="18" fill="rgba(148,163,184,0.5)">Track · Analyze · Improve</text>
</svg>
