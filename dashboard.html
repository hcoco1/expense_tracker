<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Expense Tracker | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/mobile.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="page-title">
          <h1>Today’s Money</h1>
          <p id="dashboardSubtitle">Track every move with clarity.</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
          <button class="icon-btn" type="button" data-action="logout" aria-label="Logout"><i data-lucide="log-out"></i></button>
        </div>
      </header>

      <section class="grid summary-grid" aria-label="Summary">
        <article class="card summary-card balance">
          <h2>Total Balance</h2>
          <p class="money" id="totalBalance">$0.00</p>
          <span class="trend"><i data-lucide="sparkles"></i><span id="savingsRate">0% saved in this period</span></span>
        </article>
        <article class="card summary-card">
          <h2 id="incomeLabel">Period Income</h2>
          <p class="money" id="monthlyIncome">$0.00</p>
        </article>
        <article class="card summary-card">
          <h2 id="expenseLabel">Period Expenses</h2>
          <p class="money" id="monthlyExpenses">$0.00</p>
        </article>
        <article class="card summary-card">
          <h2>Savings</h2>
          <p class="money" id="monthlySavings">$0.00</p>
        </article>
      </section>

      <section class="card panel" aria-label="Filters">
        <div class="filters">
          <select class="select wide" id="filterCategory" aria-label="Filter by category"></select>
          <select class="select" id="filterPeriod" aria-label="Reporting period">
            <option value="week">This week</option>
            <option value="month">This month</option>
            <option value="year">This year</option>
            <option value="all">All time</option>
            <option value="custom">Custom</option>
          </select>
          <select class="select" id="filterMonth" aria-label="Filter by month"></select>
          <select class="select" id="filterYear" aria-label="Filter by year"></select>
          <select class="select" id="currencySelect" aria-label="Currency"></select>
          <input class="input period-custom" id="filterStartDate" type="date" aria-label="Custom start date">
          <input class="input period-custom" id="filterEndDate" type="date" aria-label="Custom end date">
        </div>
      </section>

      <section class="grid content-grid">
        <article class="card panel">
          <div class="panel-title">
            <h2>Recent Transactions</h2>
            <button class="btn ghost" type="button" data-action="refresh"><i data-lucide="refresh-cw"></i>Refresh</button>
          </div>
          <div class="transaction-list" id="expenseList" aria-live="polite"></div>
        </article>
        <div class="grid">
          <article class="card panel">
            <div class="panel-title"><h2>Category Mix</h2></div>
            <div class="chart-box"><canvas id="categoryChart"></canvas></div>
          </article>
          <article class="card panel">
            <div class="panel-title"><h2 id="trendLabel">Period Trend</h2></div>
            <div class="chart-box"><canvas id="trendChart"></canvas></div>
          </article>
        </div>
      </section>
    </main>

    <button class="fab" type="button" data-action="open-expense-modal" aria-label="Add expense"><i data-lucide="plus"></i></button>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a class="nav-link active" href="./dashboard.html"><i data-lucide="layout-dashboard"></i><span>Home</span></a>
      <button class="nav-link" type="button" data-action="open-expense-modal"><i data-lucide="plus-circle"></i><span>Add</span></button>
      <a class="nav-link" href="./categories.html"><i data-lucide="tags"></i><span>Categories</span></a>
    </nav>

    <div class="modal-backdrop" id="expenseModal" role="dialog" aria-modal="true" aria-labelledby="expenseModalTitle">
      <section class="modal">
        <div class="modal-head">
          <h2 id="expenseModalTitle">Add Transaction</h2>
          <button class="icon-btn" type="button" data-action="close-modal" aria-label="Close"><i data-lucide="x"></i></button>
        </div>
        <form class="form" id="expenseForm" novalidate>
          <input type="hidden" id="expenseId" name="id">
          <div class="field">
            <label for="expenseAmount">Amount</label>
            <input class="input" id="expenseAmount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required>
          </div>
          <div class="field">
            <label for="expenseCategory">Category</label>
            <select class="select" id="expenseCategory" name="category_id" required></select>
          </div>
          <div class="field">
            <label for="paymentMethod">Payment Method</label>
            <select class="select" id="paymentMethod" name="payment_method" required>
              <option>Card</option>
              <option>Cash</option>
              <option>Bank Transfer</option>
              <option>Wallet</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="expenseDate">Date</label>
            <input class="input" id="expenseDate" name="expense_date" type="date" required>
          </div>
          <div class="field">
            <label for="expenseNote">Notes</label>
            <textarea class="textarea" id="expenseNote" name="note" maxlength="240" placeholder="Optional"></textarea>
          </div>
          <button class="btn primary" type="submit"><i data-lucide="save"></i>Save Transaction</button>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <section class="modal">
        <div class="modal-head">
          <h2 id="confirmTitle">Delete transaction?</h2>
          <button class="icon-btn" type="button" data-action="close-confirm" aria-label="Close"><i data-lucide="x"></i></button>
        </div>
        <p class="muted">This action cannot be undone.</p>
        <div class="row-actions">
          <button class="btn ghost" type="button" data-action="close-confirm">Cancel</button>
          <button class="btn danger" type="button" data-action="confirm-delete">Delete</button>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
