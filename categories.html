<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Expense Tracker | Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/mobile.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="page-title">
          <h1>Categories</h1>
          <p>Shape your spending and income labels.</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
          <button class="icon-btn" type="button" data-action="logout" aria-label="Logout"><i data-lucide="log-out"></i></button>
        </div>
      </header>

      <section class="card panel">
        <div class="panel-title">
          <h2>Your Categories</h2>
          <button class="btn primary" type="button" data-action="open-category-modal"><i data-lucide="plus"></i>Add</button>
        </div>
        <div class="category-list" id="categoryList" aria-live="polite"></div>
      </section>
    </main>

    <button class="fab" type="button" data-action="open-category-modal" aria-label="Add category"><i data-lucide="plus"></i></button>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a class="nav-link" href="./dashboard.html"><i data-lucide="layout-dashboard"></i><span>Home</span></a>
      <button class="nav-link" type="button" data-action="open-category-modal"><i data-lucide="plus-circle"></i><span>Add</span></button>
      <a class="nav-link active" href="./categories.html"><i data-lucide="tags"></i><span>Categories</span></a>
    </nav>

    <div class="modal-backdrop" id="categoryModal" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
      <section class="modal">
        <div class="modal-head">
          <h2 id="categoryModalTitle">Add Category</h2>
          <button class="icon-btn" type="button" data-action="close-modal" aria-label="Close"><i data-lucide="x"></i></button>
        </div>
        <form class="form" id="categoryForm" novalidate>
          <input type="hidden" id="categoryId" name="id">
          <input type="hidden" id="categoryColor" name="color" value="#3b82f6">
          <input type="hidden" id="categoryIcon" name="icon" value="circle-dollar-sign">
          <div class="field">
            <label for="categoryName">Name</label>
            <input class="input" id="categoryName" name="name" maxlength="40" required>
          </div>
          <div class="field">
            <label for="categoryType">Type</label>
            <select class="select" id="categoryType" name="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
          <div class="field">
            <label>Color</label>
            <div class="color-grid" id="colorPicker"></div>
          </div>
          <div class="field">
            <label>Icon</label>
            <div class="icon-grid" id="iconPicker"></div>
          </div>
          <button class="btn primary" type="submit"><i data-lucide="save"></i>Save Category</button>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <section class="modal">
        <div class="modal-head">
          <h2 id="confirmTitle">Delete category?</h2>
          <button class="icon-btn" type="button" data-action="close-confirm" aria-label="Close"><i data-lucide="x"></i></button>
        </div>
        <p class="muted">Transactions using this category must be reassigned or removed first.</p>
        <div class="row-actions">
          <button class="btn ghost" type="button" data-action="close-confirm">Cancel</button>
          <button class="btn danger" type="button" data-action="confirm-delete">Delete</button>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="./js/categories.js"></script>
  </body>
</html>
